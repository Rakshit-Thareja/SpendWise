name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyC3Kt4wLkpSpKbVGGWeN5OKOZhcbXgTyGE"
          VITE_FIREBASE_AUTH_DOMAIN: "spendwise-977ba.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "spendwise-977ba"
          VITE_FIREBASE_STORAGE_BUCKET: "spendwise-977ba.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "801129335244"
          VITE_FIREBASE_APP_ID: "1:801129335244:web:251f30f71151008da2f569"

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        uses: actions/deploy-pages@v4